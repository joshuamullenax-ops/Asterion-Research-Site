<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a17f3b" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>
  </defs>
  
  <!-- Icon Mark -->
  <g transform="translate(5, 5)">
    <rect width="40" height="40" rx="2" fill="#000000" stroke="#27272a" stroke-width="1"/>
    <polygon points="20,8 32,20 20,32 8,20" fill="url(#gold-grad)" stroke="#a17f3b" stroke-opacity="0.6" stroke-width="0.5"/>
    <polygon points="20,14 26,20 20,26 14,20" fill="#000000"/>
    <rect x="18.5" y="18.5" width="3" height="3" fill="#ffd700"/>
  </g>

  <!-- Brand Typography -->
  <text x="58" y="27" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" letter-spacing="3" fill="#000000" text-transform="uppercase">ASTERION</text>
  <text x="58" y="39" font-family="monospace, 'Courier New', sans-serif" font-size="9" font-weight="bold" letter-spacing="2.5" fill="#a17f3b" text-transform="uppercase">RESEARCH</text>
</svg>
